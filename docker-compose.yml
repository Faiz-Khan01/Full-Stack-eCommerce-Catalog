version: '3.8'

services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: ecom_mysql
    restart: always
    environment:
      MYSQL_DATABASE: product_catalog
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - ecom_network
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Spring Boot Backend API
  backend:
    build:
      context: ./product_catalog-backend
      dockerfile: Dockerfile
    container_name: ecom_backend
    restart: always
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/product_catalog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ecom_network

  # React Frontend (Nginx SPA + Reverse Proxy)
  frontend:
    build:
      context: ./product_catalog-frontend
      dockerfile: Dockerfile
    container_name: ecom_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - ecom_network

volumes:
  mysql_data:

networks:
  ecom_network:
    driver: bridge